services:
  # ----------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: twitter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jeevanreddy
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: twitter_backend
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeevanreddy -d twitter_backend"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # 2. Redis Cache & Rate Limiter
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: twitter_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # 3. Apache Kafka (KRaft mode - No Zookeeper)
  # ----------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: twitter_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      # KRaft Settings for Confluent Kafka
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Allow auto creation of topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Required for KRaft cluster initialization
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # 4. Node.js API Backend
  # ----------------------------------------
  api:
    build: .
    container_name: twitter_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Inject Docker Service URLs
      PORT: 3000
      NODE_ENV: development
      LOG_LEVEL: info
      
      # Connects to the docker 'postgres' service
      DATABASE_URL: "postgresql://jeevanreddy:password123@postgres:5432/twitter_backend"
      
      # Connects to the docker 'redis' service
      REDIS_URL: "redis://redis:6379"
      
      # Connects to the docker 'kafka' service
      KAFKA_BROKER: "kafka:9092"
      
      # Security (In production, inject these externally, don't hardcode)
      JWT_SECRET: "your_super_secret_key"
      JWT_EXPIRES_IN: "1d"
      
      # Cloudinary (Keep your external APIs)
      CLOUDINARY_CLOUD_NAME: dq6iidsb
      CLOUDINARY_API_KEY: 652667524258852
      CLOUDINARY_API_SECRET: CRKJFmb2QR8yecsLAsBzD2rHeu8

  # ----------------------------------------
  # 5. Prometheus (Metrics Time-Series DB)
  # ----------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: twitter_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - api

  # ----------------------------------------
  # 6. Grafana (Metrics Visualization)
  # ----------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: twitter_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # ----------------------------------------
  # 7. Postgres Exporter
  # ----------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: twitter_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://jeevanreddy:password123@postgres:5432/twitter_backend?sslmode=disable"
    depends_on:
      - postgres

  # ----------------------------------------
  # 8. Redis Exporter
  # ----------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter
    container_name: twitter_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis

  # ----------------------------------------
  # 9. Kafka Exporter
  # ----------------------------------------
  kafka-exporter:
    image: danielqsj/kafka-exporter
    container_name: twitter_kafka_exporter
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      - kafka

  # ----------------------------------------
  # 10. cAdvisor (Docker Container Metrics)
  # ----------------------------------------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: twitter_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  postgres_data:
  redis_data:
  kafka_data:
